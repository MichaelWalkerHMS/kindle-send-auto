<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      width: 320px;
      padding: 16px;
    }
    .page {
      background: var(--surface);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 12px;
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    footer {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>
  <h1>Kindle Send</h1>
  <div class="page" id="page-title"></div>

  <div class="actions">
    <button id="save-btn" class="primary">Save article</button>
    <button id="link-btn">Queue link only</button>
  </div>
  <p class="hint">
    <strong>Save article</strong> captures the page as you see it, including posts you're logged in to.
    <strong>Queue link only</strong> downloads the page later, when you build.
  </p>

  <div id="status" class="status" role="status"></div>

  <footer>
    <button id="queue-btn" class="link">Open queue</button>
    <span class="muted" id="count"></span>
  </footer>

  <script src="queue-store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
